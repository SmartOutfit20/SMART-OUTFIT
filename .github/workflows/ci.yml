name: SMART OUTFIT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Run backend and storefront unit tests
        run: npm test
      - name: Build customer storefront
        run: npm run build
