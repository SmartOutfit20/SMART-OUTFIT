services:
  - type: web
    name: smart-outfit-server
    env: node
    plan: free
    buildCommand: npm install --workspaces --include-workspace-root && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
